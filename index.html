<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6a59" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="預算記帳" />
  <title>預算記帳</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
:root{
  --text:#13233a;--muted:#66798c;--glass:rgba(245,250,255,.58);--glass-strong:rgba(248,251,255,.72);
  --line:rgba(255,255,255,.55);--blue:#168de2;--teal:#17b8ad;--danger:#ff526d;--safe-bottom:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC",system-ui,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;color:var(--text);min-height:100%;} body{min-height:100vh;background:linear-gradient(180deg,#6da9cf 0%,#9ec9dd 38%,#f6b39e 72%,#d99db9 100%);background-attachment:fixed;} body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.24),transparent 28%),radial-gradient(circle at 85% 45%,rgba(255,255,255,.16),transparent 32%);}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{position:relative;z-index:1;max-width:760px;margin:auto;min-height:100vh;padding:24px 18px calc(110px + var(--safe-bottom));}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:4px 2px 18px}.month-btn{border:0;background:transparent;color:white;padding:0;text-align:left;font-weight:800;font-size:38px;letter-spacing:-1.2px;text-shadow:0 1px 12px rgba(35,78,105,.18)}.month-controls{display:flex;gap:10px;align-items:center}.icon-btn,.primary-btn,.ghost-btn,.danger-btn{border:1px solid rgba(255,255,255,.4);display:inline-flex;align-items:center;justify-content:center;font-weight:750;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.icon-btn{width:46px;height:46px;border-radius:50%;background:rgba(236,247,255,.38);color:white;font-size:25px;box-shadow:inset 0 1px rgba(255,255,255,.5),0 8px 22px rgba(43,77,101,.12)}.primary-btn{border-radius:22px;padding:12px 17px;background:rgba(15,137,225,.82);color:white;box-shadow:0 9px 24px rgba(26,114,177,.2)}.ghost-btn{border-radius:16px;padding:12px 15px;background:rgba(255,255,255,.45);color:var(--text)}.danger-btn{border-radius:16px;padding:12px 15px;background:rgba(255,235,239,.7);color:#c52e49}
.summary,.settings-card,.category-list,.txn-list{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px rgba(255,255,255,.58),0 12px 35px rgba(51,85,110,.11);backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%)}.summary{border-radius:32px;padding:22px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kpi{padding:2px 4px}.kpi+.kpi{border-left:1px solid rgba(92,117,139,.18);padding-left:20px}.label{color:var(--muted);font-size:14px;margin-bottom:5px;font-weight:600}.value{font-size:29px;font-weight:850;letter-spacing:-.6px}.remaining-wrap{display:grid;grid-template-columns:1fr 126px;gap:18px;align-items:center;margin-top:18px}.remaining .value{font-size:45px;color:#0c8c82}.ring{--p:100;position:relative;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),rgba(104,137,155,.16) 0);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}.ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:rgba(235,246,250,.82);backdrop-filter:blur(20px)}.ring-text{position:relative;z-index:1;text-align:center}.ring-text strong{display:block;font-size:22px;color:#0a776f}.ring-text span{font-size:12px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 4px 12px;color:white;text-shadow:0 1px 8px rgba(49,79,100,.18)}.section-head h2{font-size:22px;margin:0}.link-btn{background:transparent;border:0;color:rgba(255,255,255,.9);font-weight:700}.category-list,.txn-list{border-radius:30px;overflow:hidden;display:block;padding:8px 14px}.category-card,.txn{background:transparent;border-radius:0;padding:13px 4px;display:grid;grid-template-columns:52px 1fr auto;gap:13px;align-items:center;border-bottom:1px solid rgba(103,127,145,.14);box-shadow:none}.category-card:last-child,.txn:last-child{border-bottom:0}.category-card:active,.txn:active{background:rgba(255,255,255,.22)}
.cat-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#385064;background:rgba(255,255,255,.38);box-shadow:inset 0 1px rgba(255,255,255,.5)}.category-card:nth-child(6n+1) .cat-icon{background:rgba(117,230,191,.38);color:#07906d}.category-card:nth-child(6n+2) .cat-icon{background:rgba(255,193,120,.4);color:#e27d18}.category-card:nth-child(6n+3) .cat-icon{background:rgba(119,190,255,.4);color:#157ed1}.category-card:nth-child(6n+4) .cat-icon{background:rgba(181,221,238,.45);color:#387c9b}.category-card:nth-child(6n+5) .cat-icon{background:rgba(199,151,255,.35);color:#7d3bd0}.category-card:nth-child(6n) .cat-icon{background:rgba(255,134,177,.34);color:#d83774}.cat-icon svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.cat-main{min-width:0}.cat-title{font-weight:850;font-size:17px;margin-bottom:3px}.cat-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{height:8px;background:rgba(105,131,148,.13);border-radius:999px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#26bfa8,#3fc7a0);border-radius:inherit}.category-card:nth-child(6n+2) .progress span{background:#ff9d4a}.category-card:nth-child(6n+3) .progress span{background:#2e9cf0}.category-card:nth-child(6n+5) .progress span{background:#a85be7}.category-card:nth-child(6n) .progress span{background:#ff668f}.cat-right{text-align:right;min-width:94px}.cat-right strong{display:block;color:#0a716b;font-size:17px}.cat-right span{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}.txn-meta{font-size:12px;color:var(--muted);margin-top:2px}.txn-amount{font-size:18px;font-weight:850}.page{display:none}.page.active{display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:180px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.55);border-radius:18px;padding:13px 15px;color:var(--text);backdrop-filter:blur(20px)}
.settings-card{border-radius:28px;padding:17px;margin-bottom:13px}.settings-card h3{margin:0 0 12px;font-size:18px}.budget-row{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(100,126,145,.13)}.budget-row:last-child{border-bottom:0}.money-input{width:100%;border:1px solid rgba(255,255,255,.55);border-radius:14px;padding:10px;background:rgba(255,255,255,.38);text-align:right;color:var(--text)}
/* Liquid Glass navigation: one surface and one animated selection pill. */
.nav{position:fixed;z-index:20;left:50%;bottom:calc(10px + var(--safe-bottom));transform:translateX(-50%);width:min(720px,calc(100% - 22px));height:78px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:7px 9px;border-radius:32px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(255,255,255,.48),rgba(242,247,255,.24));border:1px solid rgba(255,255,255,.72);box-shadow:0 14px 38px rgba(40,58,78,.18),inset 0 1px 1px rgba(255,255,255,.86),inset 0 -1px 1px rgba(255,255,255,.28);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)}
.nav::before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse at 15% 0,rgba(255,255,255,.5),transparent 45%),linear-gradient(110deg,rgba(105,205,255,.10),transparent 35%,rgba(255,166,202,.08))}
.nav .liquid-indicator{position:absolute;z-index:1;top:6px;left:9px;height:calc(100% - 12px);width:calc((100% - 20px)/4);border-radius:25px;pointer-events:none;background:rgba(65,83,105,.16);border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -1px 1px rgba(65,83,105,.08),0 3px 10px rgba(40,58,78,.06);backdrop-filter:blur(12px) saturate(125%);-webkit-backdrop-filter:blur(12px) saturate(125%);transition:left .38s cubic-bezier(.22,.9,.24,1),width .22s ease,transform .22s ease,border-radius .22s ease,background .22s ease,box-shadow .22s ease}
.liquid-indicator::before{content:"";position:absolute;inset:2px 7px auto;height:36%;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent);opacity:.18;transition:opacity .22s ease}
.nav.liquid-moving .liquid-indicator{background:linear-gradient(145deg,rgba(255,255,255,.64),rgba(224,244,255,.22) 60%,rgba(255,205,226,.16));border-color:rgba(255,255,255,.9);box-shadow:0 8px 22px rgba(35,75,105,.14),inset 0 1px 2px rgba(255,255,255,.98),inset 0 -8px 18px rgba(85,175,235,.12);backdrop-filter:blur(22px) saturate(200%);-webkit-backdrop-filter:blur(22px) saturate(200%)}
.nav.liquid-moving .liquid-indicator::before{opacity:1}
.nav.liquid-moving[data-direction="right"] .liquid-indicator{transform:translateX(-8px) scaleX(1.12) scaleY(.94);border-radius:22px 30px 30px 22px}
.nav.liquid-moving[data-direction="left"] .liquid-indicator{transform:translateX(8px) scaleX(1.12) scaleY(.94);border-radius:30px 22px 22px 30px}
.nav.liquid-settle .liquid-indicator{transform:scaleX(.97) scaleY(1.03);transition-duration:.16s}
.nav button{position:relative;z-index:2;min-width:0;border:0;border-radius:24px;background:transparent;color:#46566b;padding:7px 2px 5px;font-size:11px;font-weight:780;display:grid;gap:3px;place-items:center;-webkit-tap-highlight-color:transparent;transition:color .22s ease,transform .22s ease}
.nav button:active{transform:scale(.94)}
.nav button.active{color:#076db7}
.nav button:focus-visible{outline:2px solid #076db7;outline-offset:-3px}
.nav svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.05;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(255,255,255,.65));transition:transform .22s ease}
.nav button.active svg{transform:scale(1.06)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav{background:linear-gradient(180deg,rgba(245,250,255,.96),rgba(230,239,249,.94))}}
@media(prefers-reduced-motion:reduce){.nav .liquid-indicator,.nav button,.nav svg,.liquid-indicator::before{transition:none}.nav.liquid-moving .liquid-indicator,.nav.liquid-settle .liquid-indicator{transform:none}}
.fab{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--safe-bottom));width:68px;height:68px;border-radius:50%;border:1px solid rgba(255,255,255,.78);background:radial-gradient(circle at 32% 22%,rgba(255,255,255,.72),transparent 25%),linear-gradient(155deg,rgba(103,202,255,.72),rgba(0,125,231,.78));color:white;box-shadow:0 13px 30px rgba(0,102,190,.28),inset 0 1px 2px rgba(255,255,255,.9),inset 0 -8px 18px rgba(0,93,185,.18);backdrop-filter:blur(24px) saturate(190%);-webkit-backdrop-filter:blur(24px) saturate(190%);font-size:38px;line-height:1;transition:transform .2s ease,filter .2s ease}.fab:active{transform:translateX(-50%) scale(.93);filter:brightness(.96)}
.modal{position:fixed;inset:0;background:rgba(31,48,62,.28);display:none;align-items:flex-end;justify-content:center;z-index:40;backdrop-filter:blur(6px)}.modal.open{display:flex}.sheet{width:min(760px,100%);background:rgba(235,244,248,.9);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(30px);border-radius:32px 32px 0 0;padding:19px 17px calc(24px + var(--safe-bottom));max-height:90vh;overflow:auto;box-shadow:0 -18px 50px rgba(43,63,79,.18)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.sheet h3{margin:0;font-size:23px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:750}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.58);border-radius:17px;padding:14px;color:var(--text)}.field textarea{min-height:78px}.amount-input{font-size:38px;font-weight:850;text-align:center}.sheet-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:4px}.toast{position:fixed;left:50%;bottom:calc(125px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:rgba(21,36,50,.88);color:white;padding:10px 15px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60;backdrop-filter:blur(15px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.file-input{display:none}.danger-text{color:var(--danger)}
@media(max-width:520px){.app{padding:18px 12px calc(108px + var(--safe-bottom))}.month-btn{font-size:31px}.primary-btn{padding:11px 13px}.summary{padding:18px}.remaining-wrap{grid-template-columns:1fr 104px}.ring{width:100px;height:100px}.remaining .value{font-size:38px}.category-list,.txn-list{padding:6px 10px}.category-card,.txn{grid-template-columns:46px 1fr auto;padding:12px 2px}.cat-icon{width:43px;height:43px}.cat-right{min-width:82px}.fab{width:64px;height:64px}}

.budget-row{grid-template-columns:1fr 100px auto;gap:8px}.budget-name{display:flex;align-items:center;gap:8px;min-width:0}.budget-name strong{overflow-wrap:anywhere}.budget-handle,.budget-control{border:0;border-radius:10px;background:rgba(255,255,255,.4);color:var(--text);padding:8px}.budget-handle{touch-action:none;cursor:grab;font-size:20px}.budget-actions{display:flex;gap:3px}.budget-control{padding:8px 6px}.budget-control:disabled{opacity:.3;cursor:default}.budget-row.dragging{opacity:.5}.budget-row.drop-target{box-shadow:inset 0 3px var(--blue)}.category-form{display:grid;grid-template-columns:1fr 100px auto;gap:8px;margin:14px 0}.category-form input{min-width:0;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.5)}.category-help{font-size:12px;color:var(--muted);margin:0 0 10px}@media(max-width:420px){.budget-row{grid-template-columns:1fr 80px}.budget-actions{grid-column:1/-1;justify-content:flex-end}.category-form{grid-template-columns:1fr 90px}.category-form button{grid-column:1/-1}}
</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="month-btn" id="monthLabel" aria-label="選擇月份"></button>
      <div class="month-controls">
        <button class="icon-btn" id="prevMonth" aria-label="上一個月">‹</button>
        <button class="icon-btn" id="nextMonth" aria-label="下一個月">›</button>
        <button class="primary-btn" id="quickAdd">＋ 記一筆</button>
      </div>
    </header>

    <section class="page active" id="page-overview">
      <div class="summary">
        <div class="summary-grid">
          <div class="kpi"><div class="label">總預算</div><div class="value" id="totalBudget">$0</div></div>
          <div class="kpi"><div class="label">本月已支出</div><div class="value" id="totalSpent">$0</div></div>
        </div>
        <div class="remaining-wrap">
          <div class="remaining"><div class="label">剩餘預算</div><div class="value" id="totalRemaining">$0</div></div>
          <div class="ring" id="remainingRing"><div class="ring-text"><strong id="remainingPct">100%</strong><span>剩餘</span></div></div>
        </div>
      </div>
      <div class="section-head"><h2>分類剩餘</h2><button class="link-btn" id="showAll">查看全部 ›</button></div>
      <div class="category-list" id="categoryList"></div>
    </section>

    <section class="page" id="page-add">
      <div class="section-head"><h2>快速記帳</h2></div>
      <div class="settings-card">
        <p style="margin:0;color:var(--muted)">按下方「＋」或右上角「記一筆」即可新增交易。資料只存在你的裝置瀏覽器中。</p>
      </div>
    </section>

    <section class="page" id="page-transactions">
      <div class="section-head"><h2>交易紀錄</h2></div>
      <div class="toolbar"><input class="search" id="searchInput" placeholder="搜尋備註或分類" /></div>
      <div class="txn-list" id="txnList"></div>
    </section>

    <section class="page" id="page-settings">
      <div class="section-head"><h2>設定</h2></div>
      <div class="settings-card">
        <h3>每月分類預算</h3>
        <p class="category-help">拖曳 ⋮⋮ 排列分類，也可使用 ↑ ↓ 按鈕。</p>
        <div id="budgetSettings"></div>
        <form class="category-form" id="categoryForm"><input id="newCategoryName" aria-label="新分類名稱" placeholder="新分類名稱" maxlength="40" required><input id="newCategoryBudget" aria-label="新分類預算" type="number" min="0" step="1" placeholder="預算" required><button class="ghost-btn" type="submit">新增分類</button></form>
        <div style="margin-top:14px;display:flex;justify-content:space-between;gap:12px;align-items:center"><strong>總預算</strong><strong id="settingsTotal">$0</strong></div>
      </div>
      <div class="settings-card">
        <h3>資料</h3>
        <div class="toolbar">
          <button class="ghost-btn" id="exportJson">匯出 JSON</button>
          <button class="ghost-btn" id="exportCsv">匯出 CSV</button>
          <button class="ghost-btn" id="importJson">匯入 BudgetTrackingData</button>
          <input class="file-input" id="importFile" type="file" accept="application/json,.json" />
        </div>
        <button class="danger-btn" id="clearData">清除所有交易</button>
      </div>
      <div class="settings-card"><h3>加入主畫面</h3><p style="margin:0;color:var(--muted);line-height:1.6">部署到 HTTPS 網址後，在 Safari 點「分享」→「加入主畫面」，即可像 App 一樣全螢幕開啟。</p></div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="新增交易">＋</button>

  <nav class="nav" id="nav"><div class="liquid-indicator" id="liquidIndicator" aria-hidden="true"></div>
    <button class="active" data-page="overview"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H5a2 2 0 0 1-2-2Z"/><path d="M9 21v-7h6v7"/></svg><span>總覽</span></button>
    <button data-page="add"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M12 11v6M9 14h6"/></svg><span>快速記帳</span></button>
    <button data-page="transactions"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>交易</span></button>
    <button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>設定</span></button>
  </nav>

  <div class="modal" id="entryModal" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head"><h3 id="modalTitle">新增交易</h3><button class="icon-btn" id="closeModal">×</button></div>
      <form class="form" id="entryForm">
        <input type="hidden" id="editId" />
        <div class="field"><label>金額</label><input class="amount-input" id="amount" inputmode="decimal" type="number" min="0" step="1" placeholder="$0" required /></div>
        <div class="field"><label>分類</label><select id="category" required></select></div>
        <div class="field"><label>日期</label><input id="date" type="date" required /></div>
        <div class="field"><label>備註</label><textarea id="note" placeholder="例如：午餐、Game Pass、機車換輪胎"></textarea></div>
        <div class="sheet-actions"><button type="button" class="ghost-btn" id="cancelModal">取消</button><button class="primary-btn" type="submit">儲存</button></div>
        <button type="button" class="danger-btn" id="deleteEntry" style="display:none">刪除這筆交易</button>
      </form>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const DEFAULT_BUDGETS = {
  "🍚 餐費":5000,"🍰 點心":200,"🥤 飲料":300,"🧻 日用品":2000,"👔 治裝":1500,"🛍️ 購物":3000,
  "🏠 房租":10000,"📶 電信網路":2100,"🏋️ 健身":2500,"🎓 學貸":2415,"🔒 保險":1200,"📱 訂閱服務":1800,
  "⛽ 加油":400,"🛵 載具保養":800,"🚇 交通":300,"🎮 娛樂":1500,"💈 理髮":500,"💊 醫療":500,
  "📚 教育":300,"✈️ 旅行":500,"💝 社交":500,"🕯️ 公益":200,"🌑 其他":300
};
const ICONS = {
  "🍚 餐費":"food","🍰 點心":"snack","🥤 飲料":"drink","🧻 日用品":"home","👔 治裝":"shirt","🛍️ 購物":"bag",
  "🏠 房租":"house","📶 電信網路":"wifi","🏋️ 健身":"dumbbell","🎓 學貸":"book","🔒 保險":"shield","📱 訂閱服務":"phone",
  "⛽ 加油":"fuel","🛵 載具保養":"scooter","🚇 交通":"train","🎮 娛樂":"game","💈 理髮":"scissors","💊 醫療":"med",
  "📚 教育":"book","✈️ 旅行":"plane","💝 社交":"heart","🕯️ 公益":"heart","🌑 其他":"dots"
};
function categoryLabel(category){return String(category).replace(/^[\p{Extended_Pictographic}\p{Emoji_Presentation}\uFE0F\u200D]+\s*/u,'')}
function svgIcon(type){
  const p={
    food:'<path d="M7 3v7M4 3v5a3 3 0 0 0 6 0V3M7 10v11M16 3v18M16 3c3 2 4 5 4 8h-4"/>',
    snack:'<path d="M7 9h10l-1 11H8L7 9Z"/><path d="M9 9a3 3 0 0 1 6 0M10 5h4"/>',
    drink:'<path d="M7 5h10l-1 16H8L7 5Z"/><path d="M9 9h6M14 5l2-3"/>',
    home:'<path d="M3 11 12 4l9 7v9H3Z"/><path d="M8 20v-6h8v6"/>',
    shirt:'<path d="m8 4-5 3 3 5 2-1v9h8v-9l2 1 3-5-5-3c-.8 1.3-2.1 2-4 2S8.8 5.3 8 4Z"/>',
    bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    house:'<path d="M3 11 12 3l9 8v10H3Z"/><path d="M9 21v-7h6v7"/>',
    wifi:'<path d="M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0M9.5 16.5a4 4 0 0 1 5 0"/><circle cx="12" cy="20" r="1"/>',
    dumbbell:'<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>',
    book:'<path d="M4 5a4 4 0 0 1 4-2h4v18H8a4 4 0 0 0-4 2V5Z"/><path d="M20 5a4 4 0 0 0-4-2h-4v18h4a4 4 0 0 1 4 2V5Z"/>',
    shield:'<path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
    phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10 5h4M11 18h2"/>',
    fuel:'<path d="M6 3h9v18H6Z"/><path d="M8 6h5v5H8zM15 8h2l2 2v7a2 2 0 0 0 2 2V9l-2-2"/>',
    scooter:'<circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 18h6l-2-7H9M12 7h3M15 11h3l2 3"/>',
    train:'<rect x="6" y="3" width="12" height="15" rx="3"/><path d="M8 8h8M8 13h8M9 18l-2 3M15 18l2 3"/>',
    game:'<path d="M8 8h8a5 5 0 0 1 5 5v3a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-3a5 5 0 0 1 5-5Z"/><path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>',
    scissors:'<circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="m8.5 8.5 10 8M8.5 15.5l10-8"/>',
    med:'<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V4h6v3M12 10v7M8.5 13.5h7"/>',
    plane:'<path d="m3 11 18-8-8 18-2-7-8-3Z"/><path d="m11 14 4-4"/>',
    heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',
    dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
  };
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${p[type]||p.dots}</svg>`;
}

const $ = s => document.querySelector(s);
const state = {
  month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  budgets: JSON.parse(localStorage.getItem('budgetBudgets') || 'null') || {...DEFAULT_BUDGETS},
  data: JSON.parse(localStorage.getItem('BudgetTrackingData') || '{}')
};
let budgetOrder=JSON.parse(localStorage.getItem('budgetCategoryOrder')||'null')||[];
function categoryKeys(){return [...new Set([...budgetOrder.filter(k=>Object.hasOwn(state.budgets,k)),...Object.keys(state.budgets)])]}
function renderCategoryOptions(selected=$('#category').value){
 const keys=categoryKeys();
 $('#category').innerHTML=keys.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(categoryLabel(c))}</option>`).join('');
 if(selected && !keys.includes(selected)){$('#category').insertAdjacentHTML('beforeend',`<option value="${escapeHtml(selected)}">${escapeHtml(categoryLabel(selected))}（已刪除分類）</option>`)}
 if(selected)$('#category').value=selected;
}
function moveCategory(cat,target){const keys=categoryKeys(),from=keys.indexOf(cat);if(from<0||target<0||target>=keys.length)return;keys.splice(from,1);keys.splice(target,0,cat);budgetOrder=keys;save();render();renderCategoryOptions()}
function money(n){return new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n)||0).replace('NT$','$');}
function monthKey(d=state.month){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthTitle(d=state.month){return `${d.getFullYear()} 年 ${d.getMonth()+1} 月預算`}
function save(){localStorage.setItem('budgetCategoryOrder',JSON.stringify(categoryKeys()));localStorage.setItem('BudgetTrackingData',JSON.stringify(state.data));localStorage.setItem('budgetBudgets',JSON.stringify(state.budgets));}
function monthTxns(){return Array.isArray(state.data[monthKey()]) ? state.data[monthKey()] : []}
function calc(){
  const totals={}; Object.keys(state.budgets).forEach(k=>totals[k]=0);
  let spent=0; monthTxns().forEach(t=>{const a=Number(t.amount)||0;spent+=a;if(!(t.category in totals)) totals[t.category]=0;totals[t.category]+=a;});
  const budget=Object.values(state.budgets).reduce((a,b)=>a+Number(b||0),0); const remain=budget-spent; const pct=budget?remain/budget*100:0;
  return {totals,spent,budget,remain,pct};
}
function render(){
  $('#monthLabel').textContent=monthTitle();
  const c=calc(); $('#totalBudget').textContent=money(c.budget);$('#totalSpent').textContent=money(c.spent);$('#totalRemaining').textContent=money(c.remain);
  $('#remainingPct').textContent=`${c.pct.toFixed(1)}%`;$('#remainingRing').style.setProperty('--p',Math.max(0,Math.min(100,c.pct)));
  renderCategories(c);renderTxns();renderSettings();
}
function renderCategories(c){
  const host=$('#categoryList');host.innerHTML='';
  categoryKeys().forEach(cat=>{const budget=state.budgets[cat];
    const spent=c.totals[cat]||0, remain=Number(budget)-spent, pct=Number(budget)?remain/Number(budget)*100:0, used=Number(budget)?spent/Number(budget)*100:0;
    const el=document.createElement('div');el.className='category-card';
    el.innerHTML=`<div class="cat-icon">${svgIcon(ICONS[cat])}</div><div class="cat-main"><div class="cat-title">${escapeHtml(categoryLabel(cat))}</div><div class="cat-sub">已支出 ${money(spent)} / ${money(budget)}</div><div class="progress"><span style="width:${Math.max(0,Math.min(100,used))}%"></span></div></div><div class="cat-right"><strong>${money(remain)}</strong><span>${pct.toFixed(1)}%</span></div>`;
    el.addEventListener('click',()=>{switchPage('transactions');$('#searchInput').value=categoryLabel(cat);renderTxns();});host.appendChild(el);
  });
}
function renderTxns(){
  const host=$('#txnList'), q=($('#searchInput')?.value||'').trim().toLowerCase();host.innerHTML='';
  const arr=[...monthTxns()].sort((a,b)=>String(b.date).localeCompare(String(a.date))).filter(t=>!q || `${t.category} ${t.note||''}`.toLowerCase().includes(q));
  if(!arr.length){host.innerHTML='<div class="empty">這個月份還沒有符合條件的交易。</div>';return}
  arr.forEach(t=>{const el=document.createElement('div');el.className='txn';el.innerHTML=`<div class="cat-icon">${svgIcon(ICONS[t.category])}</div><div><div class="cat-title">${escapeHtml(categoryLabel(t.category))}</div><div class="txn-meta">${t.date}${t.note?` · ${escapeHtml(t.note)}`:''}</div></div><div class="txn-amount">-${money(t.amount)}</div>`;el.addEventListener('click',()=>openModal(t));host.appendChild(el);});
}
function renderSettings(){
  const host=$('#budgetSettings');host.innerHTML='';
  const keys=categoryKeys();
  keys.forEach((cat,index)=>{
    const row=document.createElement('div');row.className='budget-row';row.dataset.category=cat;
    row.innerHTML=`<div class="budget-name"><button type="button" class="budget-handle" aria-label="拖曳排列 ${escapeHtml(categoryLabel(cat))}">⋮⋮</button><strong>${escapeHtml(categoryLabel(cat))}</strong></div><input class="money-input" aria-label="${escapeHtml(categoryLabel(cat))}預算" type="number" min="0" step="1" value="${state.budgets[cat]}"><div class="budget-actions"><button type="button" class="budget-control" data-action="up" aria-label="上移" ${index===0?'disabled':''}>↑</button><button type="button" class="budget-control" data-action="down" aria-label="下移" ${index===keys.length-1?'disabled':''}>↓</button><button type="button" class="budget-control danger-text" data-action="delete" aria-label="刪除 ${escapeHtml(categoryLabel(cat))}">刪除</button></div>`;
    row.querySelector('input').addEventListener('change',e=>{const value=Number(e.target.value);if(!Number.isFinite(value)||value<0){e.target.value=state.budgets[cat];return}state.budgets[cat]=value;save();render()});
    row.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{const action=button.dataset.action;if(action==='delete'){if(!confirm(`刪除「${categoryLabel(cat)}」的預算分類？既有交易紀錄會保留。`))return;delete state.budgets[cat];budgetOrder=categoryKeys();save();render();renderCategoryOptions();toast('已刪除分類')}else moveCategory(cat,index+(action==='up'?-1:1))});
    const handle=row.querySelector('.budget-handle');let target=index;
    handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;handle.setPointerCapture(e.pointerId);row.classList.add('dragging');target=index});
    handle.addEventListener('pointermove',e=>{if(!handle.hasPointerCapture(e.pointerId))return;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.budget-row');host.querySelectorAll('.drop-target').forEach(r=>r.classList.remove('drop-target'));if(hit&&host.contains(hit)){target=keys.indexOf(hit.dataset.category);hit.classList.add('drop-target')}});
    const finish=e=>{if(!handle.hasPointerCapture(e.pointerId))return;handle.releasePointerCapture(e.pointerId);row.classList.remove('dragging');host.querySelectorAll('.drop-target').forEach(r=>r.classList.remove('drop-target'));if(e.type==='pointerup'&&target!==index)moveCategory(cat,target)};
    handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);host.appendChild(row);
  });
  $('#settingsTotal').textContent=money(Object.values(state.budgets).reduce((a,b)=>a+Number(b||0),0));
}
function openModal(txn=null){
  $('#entryModal').classList.add('open');$('#entryModal').setAttribute('aria-hidden','false');
  renderCategoryOptions(txn?.category||categoryKeys()[0]);
  $('#modalTitle').textContent=txn?'編輯交易':'新增交易';$('#editId').value=txn?.id||'';$('#amount').value=txn?.amount??'';$('#category').value=txn?.category||categoryKeys()[0]||'';$('#date').value=txn?.date||new Date().toISOString().slice(0,10);$('#note').value=txn?.note||'';$('#deleteEntry').style.display=txn?'inline-flex':'none';setTimeout(()=>$('#amount').focus(),80);
}
function closeModal(){ $('#entryModal').classList.remove('open');$('#entryModal').setAttribute('aria-hidden','true');$('#entryForm').reset();$('#editId').value=''; }
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function makeId(date){const now=new Date(), d=(date||now.toISOString().slice(0,10)).replaceAll('-','');return `${d}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
let currentNavIndex=0,liquidTimer=null,settleTimer=null;
function switchPage(page){
 if(page!=='transactions' && $('#page-transactions').classList.contains('active')){$('#searchInput').value='';renderTxns();}
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(`#page-${page}`).classList.add('active');
 const nav=$('#nav'),buttons=[...document.querySelectorAll('#nav button')],next=Math.max(0,buttons.findIndex(b=>b.dataset.page===page));
 buttons.forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const indicator=$('#liquidIndicator'),navRect=nav.getBoundingClientRect(),btnRect=buttons[next].getBoundingClientRect();
 if(next!==currentNavIndex){
  nav.dataset.direction=next>currentNavIndex?'right':'left';nav.classList.remove('liquid-settle');nav.classList.add('liquid-moving');
  clearTimeout(liquidTimer);clearTimeout(settleTimer);
  requestAnimationFrame(()=>{indicator.style.left=(btnRect.left-navRect.left)+'px';indicator.style.width=btnRect.width+'px'});
  liquidTimer=setTimeout(()=>{nav.classList.remove('liquid-moving');nav.classList.add('liquid-settle');settleTimer=setTimeout(()=>nav.classList.remove('liquid-settle'),170)},390);
 }else{indicator.style.left=(btnRect.left-navRect.left)+'px';indicator.style.width=btnRect.width+'px'}
 currentNavIndex=next;$('#fab').style.display=page==='settings'?'none':'block'
}

renderCategoryOptions();
$('#categoryForm').addEventListener('submit',e=>{
 e.preventDefault();const name=categoryLabel($('#newCategoryName').value.trim()).trim(),budget=Number($('#newCategoryBudget').value);
 if(!name||!Number.isFinite(budget)||budget<0){toast('請輸入分類名稱與有效預算');return}
 if(Object.keys(state.budgets).some(k=>categoryLabel(k).toLowerCase()===name.toLowerCase())){toast('此分類已存在');return}
 const historical=Object.values(state.data).flat().find(t=>categoryLabel(t.category)===name)?.category;
 const key=historical||name;Object.defineProperty(state.budgets,key,{value:budget,writable:true,enumerable:true,configurable:true});budgetOrder=categoryKeys();save();render();renderCategoryOptions();e.target.reset();toast('已新增分類');
});
$('#prevMonth').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()};
$('#nextMonth').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()};
$('#monthLabel').onclick=()=>{const v=prompt('輸入月份（YYYY-MM）',monthKey());if(/^\d{4}-\d{2}$/.test(v||'')){const [y,m]=v.split('-').map(Number);state.month=new Date(y,m-1,1);render()}};
$('#quickAdd').onclick=()=>openModal();$('#fab').onclick=()=>openModal();$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;
$('#entryModal').addEventListener('click',e=>{if(e.target===$('#entryModal')) closeModal()});
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();const id=$('#editId').value, date=$('#date').value, key=date.slice(0,7), tx={id:id||makeId(date),date,category:$('#category').value,amount:Number($('#amount').value)||0,note:$('#note').value.trim()};
  if(id){for(const k of Object.keys(state.data)){const i=(state.data[k]||[]).findIndex(x=>x.id===id);if(i>=0){state.data[k].splice(i,1);break}}}
  if(!state.data[key]) state.data[key]=[];state.data[key].push(tx);save();state.month=new Date(Number(key.slice(0,4)),Number(key.slice(5,7))-1,1);closeModal();render();toast(id?'已更新交易':'已新增交易');
});
$('#deleteEntry').onclick=()=>{const id=$('#editId').value;if(!id||!confirm('確定刪除這筆交易？'))return;for(const k of Object.keys(state.data)){const i=(state.data[k]||[]).findIndex(x=>x.id===id);if(i>=0){state.data[k].splice(i,1);break}}save();closeModal();render();toast('已刪除交易')};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)switchPage(b.dataset.page)});$('#searchInput').addEventListener('input',renderTxns);$('#showAll').onclick=()=>switchPage('transactions');
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#exportJson').onclick=()=>download('BudgetTrackingData.json',JSON.stringify(state.data,null,2),'application/json');
$('#exportCsv').onclick=()=>{const rows=[['id','date','category','amount','note']];Object.values(state.data).flat().forEach(t=>rows.push([t.id,t.date,t.category,t.amount,t.note||'']));const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');download('transactions.csv',csv,'text/csv;charset=utf-8')};
$('#importJson').onclick=()=>$('#importFile').click();$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const json=JSON.parse(await f.text());if(typeof json!=='object'||Array.isArray(json))throw new Error();for(const [k,v] of Object.entries(json)){if(!/^\d{4}-\d{2}$/.test(k)||!Array.isArray(v))throw new Error()}state.data=json;save();render();toast('已匯入資料')}catch{alert('JSON 格式不符合 BudgetTrackingData 結構')}e.target.value=''});
$('#clearData').onclick=()=>{if(confirm('確定清除所有交易？這個動作無法復原。')){state.data={};save();render();toast('已清除所有交易')}};

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body>
